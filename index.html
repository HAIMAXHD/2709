<script>

"use strict";


/* =========================================================
   GLOBAL STATE
========================================================= */

let store = [];
let searchEngine = null;

let stream = null;
let ocrWorker = null;

let isOCRBusy = false;
let isOCRReady = false;

let lastOCRText = "";


/* =========================================================
   DOM CACHE
========================================================= */

const $ = id => document.getElementById(id);

const video = $("video");
const canvas = $("procCanvas");

const btnAction = $("btnAction");
const loader = $("loader");
const loaderText = $("loaderText");

const ocrResult = $("ocrResult");
const displayArea = $("displayArea");

const matchStatus = $("matchStatus");
const countEl = $("count");
const ocrStatus = $("ocrStatus");


/* =========================================================
   INITIALIZATION
========================================================= */

window.addEventListener("load", initApp);


async function initApp() {

    await Promise.allSettled([
        initCamera(),
        initOCRWorker()
    ]);

    await autoLoadDatabase();
}


/* =========================================================
   CAMERA
========================================================= */

async function initCamera() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        showCameraError(
            "Trình duyệt không hỗ trợ camera."
        );

        return;
    }

    try {

        stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }
                },

                audio: false

            });

        video.srcObject = stream;

        await video.play();

    } catch (error) {

        console.error("Camera error:", error);

        showCameraError(
            getCameraErrorMessage(error)
        );
    }
}


function getCameraErrorMessage(error) {

    switch (error.name) {

        case "NotAllowedError":
            return "Bạn chưa cấp quyền sử dụng camera.";

        case "NotFoundError":
            return "Không tìm thấy camera.";

        case "NotReadableError":
            return "Camera đang được ứng dụng khác sử dụng.";

        case "SecurityError":
            return "Camera yêu cầu HTTPS.";

        default:
            return "Không thể mở camera: " +
                error.message;
    }
}


function showCameraError(message) {

    displayArea.innerHTML = `
        <div class="bg-red-50 text-red-600
                    rounded-xl p-4 text-sm">
            📷 ${escapeHTML(message)}
        </div>
    `;
}


/* =========================================================
   OCR
========================================================= */

async function initOCRWorker() {

    if (isOCRReady && ocrWorker) {
        return true;
    }

    ocrStatus.textContent =
        "⏳ ĐANG KẾT NỐI OCR...";

    ocrStatus.className =
        "text-[10px] font-bold text-amber-500 ml-auto";

    try {

        if (!ocrWorker) {

            ocrWorker =
                await Tesseract.createWorker("vie");

        }

        await ocrWorker.setParameters({

            /*
             * 6 = Assume a single uniform block
             * of text.
             */
            tessedit_pageseg_mode: "6",

            preserve_interword_spaces: "1"

        });

        isOCRReady = true;

        ocrStatus.textContent =
            "⚡ OCR SẴN SÀNG";

        ocrStatus.className =
            "text-[10px] font-bold text-emerald-600 ml-auto";

        return true;

    } catch (error) {

        console.error(
            "OCR initialization failed:",
            error
        );

        isOCRReady = false;

        ocrStatus.textContent =
            "❌ OCR LỖI - BẤM THỬ LẠI";

        ocrStatus.className =
            "text-[10px] font-bold text-red-500 ml-auto cursor-pointer";

        ocrStatus.onclick = initOCRWorker;

        return false;
    }
}


/* =========================================================
   DATABASE
========================================================= */

async function autoLoadDatabase() {

    try {

        const response =
            await fetch(
                "data 26 09 2026.db",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            return;
        }

        const buffer =
            await response.arrayBuffer();

        await loadSqlDb(buffer);

    } catch (error) {

        console.log(
            "Không tự động tải được DB:",
            error
        );
    }
}


async function loadSqlDb(arrayBuffer) {

    try {

        countEl.textContent =
            "⏳ ĐANG NẠP DB...";

        const SQL =
            await initSqlJs({

                locateFile: file =>
                    `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`

            });


        const db =
            new SQL.Database(
                new Uint8Array(arrayBuffer)
            );


        const result =
            db.exec(`
                SELECT
                    col_1,
                    col_2,
                    col_3,
                    col_4,
                    col_5,
                    col_6,
                    col_7
                FROM data_table
            `);


        if (!result.length ||
            !result[0].values.length) {

            throw new Error(
                "Bảng data_table không có dữ liệu."
            );
        }


        const rows = result[0].values;


        store = rows

            .filter(row => {

                return row &&
                    row.length >= 7 &&
                    row[0] !== null &&
                    row[1];

            })

            .map(row => {

                const title =
                    String(row[1] ?? "");

                const options = [
                    row[2],
                    row[3],
                    row[4],
                    row[5]
                ].map(value =>
                    value == null
                        ? ""
                        : String(value)
                );


                let ans =
                    Number.parseInt(
                        row[6],
                        10
                    );


                /*
                 * DB hiện tại được giả định:
                 * 1 = A
                 * 2 = B
                 * 3 = C
                 * 4 = D
                 */
                if (
                    !Number.isInteger(ans) ||
                    ans < 1 ||
                    ans > 4
                ) {
                    ans = 0;
                }


                return {

                    id: row[0],

                    title,

                    options,

                    ans,

                    clean:
                        fastClean(title)

                };

            });


        if (!store.length) {

            throw new Error(
                "Không tìm thấy câu hỏi hợp lệ."
            );
        }


        /*
         * Fuse search:
         *
         * threshold thấp hơn giúp tránh
         * match nhầm các câu gần giống.
         */
        searchEngine =
            new Fuse(store, {

                keys: [
                    {
                        name: "clean",
                        weight: 1
                    }
                ],

                threshold: 0.38,

                distance: 300,

                ignoreLocation: true,

                includeScore: true,

                minMatchCharLength: 3,

                shouldSort: true

            });


        countEl.textContent =
            `READY: ${store.length.toLocaleString("vi-VN")} CÂU`;

        db.close();


    } catch (error) {

        console.error(
            "Database error:",
            error
        );

        countEl.textContent =
            "❌ DB LỖI";

        alert(
            "Lỗi nạp cơ sở dữ liệu:\n" +
            error.message
        );
    }
}


/* =========================================================
   FILE INPUT
========================================================= */

function initData(event) {

    const file =
        event.target.files?.[0];

    if (!file) {
        return;
    }


    if (!/\.(db|sqlite)$/i.test(file.name)) {

        alert(
            "Vui lòng chọn file .db hoặc .sqlite"
        );

        return;
    }


    const reader =
        new FileReader();


    reader.onload = async e => {

        try {

            await loadSqlDb(
                e.target.result
            );

        } catch (error) {

            console.error(error);

        }

    };


    reader.onerror = () => {

        alert(
            "Không thể đọc file DB."
        );

    };


    reader.readAsArrayBuffer(file);
}


/* =========================================================
   IMAGE PROCESSING
========================================================= */

function preprocessCanvas(canvas) {

    const ctx =
        canvas.getContext("2d", {
            willReadFrequently: true
        });


    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data =
        image.data;


    /*
     * Contrast vừa phải.
     *
     * Không threshold quá mạnh vì:
     * - chữ tiếng Việt có dấu
     * - antialiasing
     * - font nhỏ
     */

    const contrast = 1.35;

    const factor =
        (259 * (contrast + 255)) /
        (255 * (259 - contrast));


    for (
        let i = 0;
        i < data.length;
        i += 4
    ) {

        let gray =
            0.299 * data[i] +
            0.587 * data[i + 1] +
            0.114 * data[i + 2];


        gray =
            factor *
            (gray - 128) +
            128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;
    }


    ctx.putImageData(
        image,
        0,
        0
    );
}


/* =========================================================
   CAMERA CROP - FIX OBJECT-FIT:COVER
========================================================= */

function calculateCoverCrop(
    video,
    sourceWidth,
    sourceHeight
) {

    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    const displayWidth =
        video.clientWidth;

    const displayHeight =
        video.clientHeight;


    /*
     * object-fit: cover dùng MỘT scale.
     */

    const scale =
        Math.max(
            displayWidth / videoWidth,
            displayHeight / videoHeight
        );


    /*
     * Kích thước ảnh thật đang được
     * hiển thị trên màn hình.
     */

    const renderedWidth =
        videoWidth * scale;

    const renderedHeight =
        videoHeight * scale;


    /*
     * Phần ảnh bị cắt bởi object-fit:cover.
     */

    const offsetX =
        (renderedWidth -
            displayWidth) / 2;

    const offsetY =
        (renderedHeight -
            displayHeight) / 2;


    /*
     * Vị trí vùng scan trên màn hình.
     */

    const overlayWidth =
        displayWidth * 0.92;

    const overlayHeight =
        115;


    const overlayLeft =
        (displayWidth -
            overlayWidth) / 2;

    const overlayTop =
        (displayHeight -
            overlayHeight) / 2;


    /*
     * Chuyển từ tọa độ màn hình
     * về tọa độ ảnh camera thật.
     */

    const sx =
        (overlayLeft +
            offsetX) / scale;

    const sy =
        (overlayTop +
            offsetY) / scale;


    const sw =
        overlayWidth / scale;

    const sh =
        overlayHeight / scale;


    return {

        x: Math.max(
            0,
            Math.min(
                videoWidth - 1,
                sx
            )
        ),

        y: Math.max(
            0,
            Math.min(
                videoHeight - 1,
                sy
            )
        ),

        width: Math.min(
            sw,
            videoWidth - sx
        ),

        height: Math.min(
            sh,
            videoHeight - sy
        )

    };
}


/* =========================================================
   OCR CAPTURE
========================================================= */

async function smartCapture() {

    /*
     * Chống chạy OCR song song.
     */

    if (isOCRBusy) {
        return;
    }


    if (!store.length ||
        !searchEngine) {

        alert(
            "Vui lòng nạp file cơ sở dữ liệu SQLite trước!"
        );

        return;
    }


    if (!isOCRReady ||
        !ocrWorker) {

        const ready =
            await initOCRWorker();

        if (!ready) {

            alert(
                "OCR chưa sẵn sàng."
            );

            return;
        }
    }


    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        alert(
            "Camera chưa sẵn sàng."
        );

        return;
    }


    isOCRBusy = true;

    btnAction.classList.add(
        "disabled-button"
    );

    loaderText.textContent =
        "ĐANG CHỤP ẢNH...";

    loader.style.display =
        "flex";


    try {

        const crop =
            calculateCoverCrop(
                video,
                video.videoWidth,
                video.videoHeight
            );


        /*
         * Scale output lên để OCR dễ đọc hơn.
         */

        const outputScale = 2;


        canvas.width =
            Math.round(
                crop.width *
                outputScale
            );


        canvas.height =
            Math.round(
                crop.height *
                outputScale
            );


        const ctx =
            canvas.getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            );


        ctx.imageSmoothingEnabled =
            true;


        ctx.imageSmoothingQuality =
            "high";


        ctx.drawImage(

            video,

            crop.x,
            crop.y,
            crop.width,
            crop.height,

            0,
            0,
            canvas.width,
            canvas.height
        );


        /*
         * Preprocess
         */

        loaderText.textContent =
            "ĐANG XỬ LÝ ẢNH...";

        preprocessCanvas(canvas);


        /*
         * OCR
         */

        loaderText.textContent =
            "ĐANG NHẬN DIỆN CHỮ...";


        const result =
            await ocrWorker.recognize(
                canvas
            );


        let text =
            normalizeOCRText(
                result?.data?.text || ""
            );


        lastOCRText =
            text;


        ocrResult.value =
            text;


        if (text) {

            loaderText.textContent =
                "ĐANG TÌM CÂU HỎI...";

            execSearch(text);

        } else {

            matchStatus.textContent =
                "⚠️ KHÔNG ĐỌC ĐƯỢC";

            matchStatus.className =
                "text-[10px] font-bold text-amber-500";

            displayArea.innerHTML = `
                <div class="text-center
                            text-gray-400 py-10">

                    Không nhận diện được
                    nội dung trong vùng quét.

                </div>
            `;
        }


    } catch (error) {

        console.error(
            "OCR error:",
            error
        );


        matchStatus.textContent =
            "❌ OCR LỖI";


        displayArea.innerHTML = `
            <div class="bg-red-50
                        text-red-600
                        rounded-xl p-4 text-sm">

                OCR gặp lỗi:
                ${escapeHTML(error.message)}

            </div>
        `;


    } finally {

        loader.style.display =
            "none";

        btnAction.classList.remove(
            "disabled-button"
        );

        isOCRBusy = false;
    }
}


/* =========================================================
   OCR TEXT NORMALIZATION
========================================================= */

function normalizeOCRText(text) {

    if (!text) {
        return "";
    }


    return text

        /*
         * newline -> space
         */
        .replace(/[\r\n]+/g, " ")

        /*
         * Một số OCR trả về ký tự lạ.
         * Giữ Unicode letters/numbers.
         */
        .replace(
            /[^\p{L}\p{N}\s.,?!:;'"()\-]/gu,
            " "
        )

        /*
         * Chuẩn hóa khoảng trắng
         */
        .replace(/\s+/g, " ")

        .trim();
}


/* =========================================================
   SEARCH NORMALIZATION
========================================================= */

function fastClean(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }


    return String(value)

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .replace(
            /đ/gi,
            "d"
        )

        .toLowerCase()

        .replace(
            /[^\p{L}\p{N}\s]/gu,
            " "
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* =========================================================
   SEARCH
========================================================= */

function manualSearch() {

    const text =
        ocrResult.value;

    execSearch(text);
}


function execSearch(text) {

    if (
        !searchEngine ||
        !store.length
    ) {

        return;
    }


    const query =
        fastClean(text);


    if (!query) {

        matchStatus.textContent =
            "";

        return;
    }


    /*
     * Không tìm query quá ngắn vì dễ match nhầm.
     */

    if (query.length < 3) {

        matchStatus.textContent =
            "⚠️ TỪ KHÓA QUÁ NGẮN";

        matchStatus.className =
            "text-[10px] font-bold text-amber-500";

        r
